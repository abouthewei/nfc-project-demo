<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>窑格 · 窑火风格效果图</title>
  <style>
    :root {
      color-scheme: dark;
      --coal: #101213;
      --coal-soft: #1b1b19;
      --ash: #c8bdac;
      --paper: #e9deca;
      --clay: #a64f34;
      --ember: #dc7943;
      --gold: #c7a06f;
      --serif: "STKaiti", "Kaiti SC", "Songti SC", "Songti", "Noto Serif CJK SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d0e0f;
      color: var(--paper);
      font-family: var(--sans);
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: radial-gradient(ellipse at top, #27221d 0%, #101112 42rem); }
    .board-head { max-width: 1280px; margin: 0 auto; padding: 52px 28px 36px; }
    .board-kicker { margin: 0 0 10px; color: #bd805b; font: 12px var(--sans); letter-spacing: .28em; }
    .board-head h1 { margin: 0; color: #eadbc4; font: 500 clamp(28px,4vw,42px)/1.35 var(--serif); letter-spacing: .08em; }
    .board-head p:last-child { max-width: 690px; margin: 12px 0 0; color: #948a7f; font-size: 13px; line-height: 1.8; }
    .screen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 390px)); justify-content: center; align-items: start; gap: 54px 30px; max-width: 1320px; margin: 0 auto; padding: 0 22px 80px; }
    .screen-figure { min-width: 0; margin: 0; }
    .screen-caption { display: flex; align-items: baseline; gap: 11px; margin: 0 0 12px 3px; color: #ded0bb; font: 17px var(--serif); letter-spacing: .06em; }
    .screen-caption span { color: #c17a53; font: 11px var(--sans); letter-spacing: .18em; }
    .mock-screen { position: relative; container-type: size; width: 100%; aspect-ratio: 390 / 844; overflow: hidden; isolation: isolate; border: 1px solid rgba(215,193,164,.16); background: var(--coal); box-shadow: 0 24px 55px rgba(0,0,0,.46); }
    .mock-screen::after { position: absolute; z-index: 30; inset: 0; content: ""; pointer-events: none; background: url("../assets/paper-grain.webp") repeat; background-size: 350px auto; opacity: .07; mix-blend-mode: screen; }
    .scene { position: absolute; z-index: -2; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .scene-shade { position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,.84) 0%, rgba(12,13,14,.54) 28%, rgba(12,12,11,.24) 58%, rgba(10,10,9,.93) 100%); }
    .screen-top { position: absolute; top: 4.1cqh; right: 5.2cqw; left: 5.2cqw; display: flex; align-items: center; justify-content: space-between; color: #dbcfbd; font: 3.25cqw var(--serif); letter-spacing: .14em; }
    .screen-top .right { color: #c8a787; font: 2.8cqw var(--sans); letter-spacing: .08em; }
    .screen-top .back { display: inline-flex; align-items: center; gap: 1.3cqw; }
    .back-mark { display: inline-grid; width: 7.4cqw; height: 7.4cqw; place-items: center; border: 1px solid rgba(226,207,179,.35); border-radius: 50%; font: 4.3cqw var(--serif); }
    .micro-label { color: #cc875d; font: 2.8cqw var(--sans); letter-spacing: .2em; }
    .screen-title { margin: 0; color: #eadfcf; font: 500 8.2cqw/1.34 var(--serif); letter-spacing: .08em; text-shadow: 0 2px 18px rgba(0,0,0,.7); }
    .small-copy { margin: 0; color: #c0b5a6; font: 3.6cqw/1.8 var(--serif); letter-spacing: .04em; }
    .clay-button { display: flex; min-height: 8.5cqh; align-items: center; justify-content: center; gap: 2.5cqw; padding: 0 6cqw; border: 1px solid rgba(244,195,145,.48); border-radius: 15px; color: #281810; background: linear-gradient(180deg,rgba(210,139,96,.13),rgba(105,47,31,.12)),#a95a3c url("../assets/yaoge/terracotta-relief.webp") center / cover; box-shadow: 0 9px 22px rgba(0,0,0,.42), inset 0 1px rgba(255,232,196,.55); font: 500 5.1cqw var(--serif); letter-spacing: .15em; text-shadow: 0 1px rgba(248,224,194,.78); }
    .clay-button .arrow { font: 6cqw var(--serif); }
    .quiet-button { display: flex; min-height: 11cqh; align-items: center; justify-content: center; padding: 0 4cqw; border: 1px solid rgba(218,191,156,.33); background: rgba(18,18,17,.64); color: #dfceb7; font: 3.4cqw var(--serif); letter-spacing: .1em; }
    .thin-rule { width: 15cqw; height: 1px; margin: 4.4cqh 0; background: #b8663e; }
    .page-note { color: #a39a8e; font: 2.8cqw/1.8 var(--serif); letter-spacing: .04em; text-align: center; }
    .inset-panel { border: 1px solid rgba(205,177,140,.3); background: rgba(16,17,17,.84); box-shadow: inset 0 0 0 1px rgba(255,255,255,.018); }

    /* 01 · Home */
    .home-content { position: absolute; top: 19cqh; right: 7cqw; left: 7cqw; }
    .home-content .micro-label { margin-bottom: 3.5cqh; }
    .home-content .screen-title { font-size: 11.5cqw; line-height: 1.14; }
    .home-content .small-copy { margin-top: 4.5cqh; font-size: 4.15cqw; }
    .home-cta { position: absolute; right: 10cqw; bottom: 15.3cqh; left: 10cqw; }
    .home-meta { position: absolute; bottom: 10.2cqh; width: 100%; color: #c5b8a7; font: 3.4cqw var(--serif); letter-spacing: .14em; text-align: center; }
    .home-disclaimer { position: absolute; right: 9cqw; bottom: 4.2cqh; left: 9cqw; margin: 0; color: #a1988c; font: 2.9cqw/1.7 var(--serif); text-align: center; }
    .kiln-mark { position: absolute; right: 9cqw; bottom: 32cqh; width: 16cqw; height: 16cqw; padding: 2cqw; border: 1px solid rgba(196,135,93,.5); border-radius: 50%; background: rgba(22,21,19,.74); box-shadow: 0 0 25px rgba(219,99,42,.22); }

    /* 02 · Question */
    .quiz-top { position: absolute; top: 13cqh; right: 7cqw; left: 7cqw; }
    .quiz-progress { display: flex; justify-content: space-between; margin-bottom: 2cqh; color: #d8c7af; font: 3.2cqw var(--serif); letter-spacing: .12em; }
    .progress-track { height: 1px; background: rgba(233,220,198,.23); }
    .progress-track i { display: block; width: 20%; height: 2px; background: #d98755; box-shadow: 0 0 10px #d98755; }
    .quiz-question { position: absolute; top: 23cqh; right: 7cqw; left: 7cqw; }
    .quiz-question .q-number { margin-bottom: 2.5cqh; color: #ca8156; font: 3.4cqw var(--serif); letter-spacing: .18em; }
    .quiz-question h2 { margin: 0 0 2.3cqh; color: #eee2cf; font: 500 6.3cqw/1.52 var(--serif); letter-spacing: .06em; }
    .quiz-question p { color: #a99f93; font: 2.8cqw/1.6 var(--sans); }
    .answers { display: grid; gap: 1.35cqh; margin-top: 4cqh; }
    .answer { display: grid; min-height: 8.6cqh; grid-template-columns: 8cqw 1fr; align-items: center; gap: 3cqw; padding: 0 4cqw; border: 1px solid rgba(220,200,169,.22); background: rgba(17,18,18,.82); color: #d1c6b7; font: 3.45cqw/1.5 var(--serif); }
    .answer b { display: grid; width: 7cqw; height: 7cqw; place-items: center; border: 1px solid rgba(206,140,94,.55); border-radius: 50%; color: #ce8d61; font: 3.2cqw var(--serif); }
    .answer.selected { border-color: #bd7045; background: rgba(117,54,34,.36); color: #f0dfc9; }
    .answer.selected b { background: #a45135; color: #f5e5d0; }
    .quiz-bottom { position: absolute; right: 7cqw; bottom: 5.4cqh; left: 7cqw; display: flex; align-items: center; justify-content: space-between; color: #928a7d; font: 2.9cqw var(--sans); }
    .quiz-bottom span:first-child, .quiz-bottom span:last-child { color: #dbc8b0; font: 3.1cqw var(--serif); }

    /* 03 · Calculation */
    .calculate-center { position: absolute; top: 35cqh; right: 8cqw; left: 8cqw; display: grid; justify-items: center; text-align: center; }
    .fire-eye { display: grid; width: 26cqw; height: 26cqw; place-items: center; margin-bottom: 5cqh; border: 1px solid rgba(233,145,81,.55); border-radius: 50%; box-shadow: 0 0 0 8px rgba(172,75,38,.09),0 0 55px rgba(227,89,35,.28); color: #f1ad76; font: 10cqw var(--serif); }
    .calculate-center h2 { margin: 0; color: #efe0cb; font: 500 7cqw/1.5 var(--serif); letter-spacing: .1em; }
    .calculate-center p { margin: 2.7cqh 0 0; color: #b3a697; font: 3.5cqw/1.9 var(--serif); letter-spacing: .13em; }
    .calculate-dots { display: flex; gap: 2cqw; margin-top: 5cqh; }
    .calculate-dots i { width: 1.4cqw; height: 1.4cqw; border-radius: 50%; background: #c8774c; box-shadow: 0 0 10px #c8774c; }

    /* 04 · Result */
    .result-top { position: absolute; top: 13cqh; right: 7cqw; left: 7cqw; text-align: center; }
    .result-badge { display: inline-flex; align-items: center; gap: 2cqw; padding: 1.3cqh 3cqw; border: 1px solid rgba(213,169,118,.36); background: rgba(14,15,15,.54); color: #d4b18a; font: 3cqw var(--serif); letter-spacing: .16em; }
    .result-art { position: absolute; top: 19cqh; left: 19cqw; width: 62cqw; height: 34cqh; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); mix-blend-mode: lighten; }
    .result-copy { position: absolute; top: 53cqh; right: 6cqw; left: 6cqw; text-align: center; }
    .result-copy h2 { margin: 0; color: #efe2cf; font: 500 8cqw var(--serif); letter-spacing: .15em; text-shadow: 0 2px 16px #000; }
    .result-copy p { margin: 1.6cqh 0 0; color: #c7b8a4; font: 3.4cqw var(--serif); letter-spacing: .06em; }
    .result-cta { position: absolute; right: 9cqw; bottom: 5.5cqh; left: 9cqw; }
    .six-strip { position: absolute; right: 7cqw; bottom: 17cqh; left: 7cqw; display: grid; grid-template-columns: repeat(6,1fr); gap: 1cqw; }
    .six-strip img { display: block; width: 8cqw; height: 8cqw; margin: auto; }
    .six-strip span { display: block; margin-top: .6cqh; color: #c2b5a4; font: 2.4cqw var(--serif); text-align: center; }

    /* 05 · Journey */
    .content-head { position: absolute; top: 12cqh; right: 7cqw; left: 7cqw; }
    .content-head .screen-title { margin-top: 1.2cqh; font-size: 8cqw; }
    .content-head .small-copy { margin-top: 1cqh; font-size: 3.2cqw; }
    .clan-chip { display: inline-flex; align-items: center; gap: 1.8cqw; padding: 1cqh 2.5cqw; border: 1px solid rgba(215,178,134,.36); background: rgba(14,15,15,.68); color: #d6bb98; font: 2.8cqw var(--serif); }
    .clan-chip img { width: 7cqw; height: 7cqw; }
    .mode-row { position: absolute; top: 33cqh; right: 7cqw; left: 7cqw; display: grid; grid-template-columns: repeat(3,1fr); gap: 2cqw; }
    .mode { min-height: 10cqh; border: 1px solid rgba(211,184,151,.27); background: rgba(15,16,16,.78); color: #bfb3a3; text-align: center; }
    .mode strong { display: block; color: #dfceb8; font: 3.6cqw var(--serif); }
    .mode small { display: block; margin-top: .8cqh; color: #918579; font-size: 2.45cqw; }
    .mode.active { border-color: #bd7046; background: rgba(130,62,40,.31); box-shadow: inset 0 -2px #c4764d; }
    .route-stats { position: absolute; top: 46cqh; right: 7cqw; left: 7cqw; display: grid; grid-template-columns: repeat(3,1fr); padding: 2.8cqh 1cqw; border-block: 1px solid rgba(214,191,157,.2); }
    .route-stats div { text-align: center; }
    .route-stats strong { display: block; color: #dfad81; font: 5.5cqw var(--serif); }
    .route-stats span { color: #a69c8e; font-size: 2.65cqw; }
    .next-point { position: absolute; top: 61cqh; right: 7cqw; left: 7cqw; padding: 3cqw 3.5cqw; }
    .next-point small { color: #c57f55; font: 2.8cqw var(--sans); letter-spacing: .15em; }
    .next-point h3 { margin: 1.2cqh 0; color: #e8dac5; font: 4.3cqw var(--serif); }
    .next-point p { margin: 0; color: #aea394; font: 2.8cqw/1.7 var(--serif); }
    .journey-action { position: absolute; right: 7cqw; bottom: 4.5cqh; left: 7cqw; }

    /* 06 · Mission */
    .mission-hero { position: absolute; top: 12cqh; right: 7cqw; left: 7cqw; }
    .mission-hero h2 { margin: 1cqh 0 1.7cqh; color: #eee1ce; font: 500 7.4cqw/1.45 var(--serif); letter-spacing: .05em; }
    .mission-hero p { margin: 0; color: #c2b7a8; font: 3.45cqw/1.85 var(--serif); }
    .mission-hero .mission-place { display: flex; align-items: center; gap: 2cqw; margin-top: 2.2cqh; color: #c8895e; font: 2.8cqw var(--sans); }
    .arrival { position: absolute; top: 43cqh; right: 7cqw; left: 7cqw; display: grid; grid-template-columns: 9cqw 1fr; gap: 2cqw; align-items: center; padding: 3cqw; }
    .arrival img { width: 8cqw; height: 8cqw; }
    .arrival strong { color: #e5d4bd; font: 3.5cqw var(--serif); }
    .arrival p { margin: .7cqh 0 0; color: #9d9488; font: 2.6cqw/1.6 var(--serif); }
    .arrival .arrival-button { grid-column: 1 / -1; min-height: 8.2cqh; margin-top: 1cqh; border: 1px solid rgba(212,168,125,.35); background: rgba(82,47,35,.46); color: #e0c8ad; font: 3.15cqw var(--serif); }
    .task-prompt { position: absolute; top: 66cqh; right: 7cqw; left: 7cqw; }
    .task-prompt p { margin: 0 0 1.5cqh; color: #c78054; font: 2.8cqw var(--sans); letter-spacing: .16em; }
    .task-prompt .observation { height: 12cqh; padding: 3cqw; border: 1px solid rgba(203,177,145,.28); color: #e3d6c4; background: rgba(16,17,17,.72); font: 3.2cqw var(--serif); }
    .task-action { position: absolute; right: 7cqw; bottom: 4.7cqh; left: 7cqw; }

    /* 07 / 08 · Fire points */
    .point-list-head { position: absolute; top: 12cqh; right: 7cqw; left: 7cqw; }
    .point-list-head h2 { margin: 1cqh 0; color: #eee1cf; font: 500 8cqw var(--serif); }
    .point-list-head p { margin: 0; color: #a99f91; font: 2.8cqw/1.7 var(--serif); }
    .points-list { position: absolute; top: 29cqh; right: 7cqw; bottom: 12cqh; left: 7cqw; overflow: hidden; }
    .point-row { display: grid; min-height: 6.6cqh; grid-template-columns: 10cqw 1fr 5cqw; align-items: center; gap: 2cqw; border-bottom: 1px solid rgba(213,192,165,.16); }
    .point-row > b { color: #c47e56; font: 3.1cqw var(--serif); }
    .point-row strong { display: block; color: #e0d4c3; font: 3.3cqw var(--serif); }
    .point-row small { display: block; margin-top: .5cqh; color: #8f8578; font: 2.3cqw var(--sans); }
    .point-row i { color: #c7855c; font: 4cqw var(--serif); font-style: normal; }
    .point-detail-hero { position: absolute; top: 0; right: 0; left: 0; height: 46cqh; overflow: hidden; }
    .point-detail-hero img { width: 100%; height: 100%; object-fit: cover; object-position: 62% center; filter: brightness(.66) saturate(.78); }
    .point-detail-hero::after { position: absolute; inset: 0; content: ""; background: linear-gradient(180deg,rgba(10,11,12,.1),rgba(10,11,12,.1) 45%,#111212 100%); }
    .point-detail-copy { position: absolute; z-index: 2; top: 30cqh; right: 7cqw; left: 7cqw; }
    .point-detail-copy h2 { margin: 1.5cqh 0; color: #eee1cd; font: 500 7.5cqw var(--serif); }
    .point-detail-copy p { margin: 0; color: #c4b7a6; font: 3cqw/1.7 var(--serif); }
    .topic-chips { display: flex; flex-wrap: wrap; gap: 1.3cqw; margin-top: 2cqh; }
    .topic-chips span { padding: .8cqh 2cqw; border: 1px solid rgba(205,159,112,.32); color: #d7b18b; font: 2.5cqw var(--serif); }
    .point-missions { position: absolute; top: 57cqh; right: 7cqw; left: 7cqw; }
    .point-missions p { margin: 0 0 1.2cqh; color: #c68056; font: 2.8cqw var(--sans); letter-spacing: .15em; }
    .point-missions div { display: flex; justify-content: space-between; padding: 2cqh 0; border-bottom: 1px solid rgba(215,195,166,.18); color: #ddd1c0; font: 3.4cqw var(--serif); }

    /* 09 / 10 · Kiln opening */
    .opening-message { position: absolute; top: 21cqh; right: 9cqw; left: 9cqw; text-align: center; }
    .opening-message .micro-label { margin-bottom: 2cqh; }
    .opening-message h2 { margin: 0; color: #eadcc6; font: 500 10cqw/1.45 var(--serif); letter-spacing: .12em; }
    .opening-message p { margin: 2cqh 0 0; color: #b7ac9e; font: 3.2cqw/1.8 var(--serif); }
    .seed-meter { position: absolute; top: 49cqh; right: 9cqw; left: 9cqw; }
    .seed-meter > div:first-child { display: flex; justify-content: space-between; color: #d3bea3; font: 3.1cqw var(--serif); }
    .meter-track { height: 3px; margin-top: 1.5cqh; background: rgba(229,215,192,.2); }
    .meter-track i { display: block; width: 15%; height: 100%; background: #d97845; }
    .lock-tasks { margin-top: 4cqh; color: #a89c8d; font: 2.8cqw/2 var(--serif); }
    .lock-action { position: absolute; right: 9cqw; bottom: 12cqh; left: 9cqw; }
    .success-message { position: absolute; top: 18cqh; right: 8cqw; left: 8cqw; text-align: center; }
    .success-message .seal { display: inline-grid; width: 15cqw; height: 15cqw; place-items: center; margin-bottom: 2cqh; border: 1px solid rgba(223,150,95,.5); border-radius: 50%; background: rgba(68,33,24,.52); color: #e39158; font: 8cqw var(--serif); box-shadow: 0 0 46px rgba(211,92,41,.3); }
    .success-message h2 { margin: 0; color: #eddfca; font: 500 10cqw/1.4 var(--serif); }
    .success-message p { margin: 1.5cqh 0 0; color: #cfb69b; font: 3.3cqw var(--serif); }
    .memory-ticket { position: absolute; top: 47cqh; right: 8cqw; left: 8cqw; padding: 4cqw; background: rgba(15,16,16,.89); }
    .memory-ticket .ticket-top { display: flex; justify-content: space-between; color: #b77852; font: 2.6cqw var(--sans); letter-spacing: .14em; }
    .memory-ticket h3 { margin: 2.7cqh 0 1.5cqh; color: #eadbc6; font: 500 7cqw var(--serif); letter-spacing: .14em; }
    .ticket-stats { display: grid; grid-template-columns: repeat(3,1fr); padding-top: 2cqh; border-top: 1px solid rgba(214,184,147,.24); }
    .ticket-stats strong { display: block; color: #d99361; font: 4.9cqw var(--serif); }
    .ticket-stats span { display: block; margin-top: .7cqh; color: #9b9184; font-size: 2.55cqw; }
    .success-action { position: absolute; right: 8cqw; bottom: 5cqh; left: 8cqw; }

    /* 11 · Share */
    .share-heading { position: absolute; top: 11cqh; right: 7cqw; left: 7cqw; }
    .share-heading h2 { margin: 1cqh 0; color: #eddfcc; font: 500 7.7cqw var(--serif); letter-spacing: .08em; }
    .share-heading p { margin: 0; color: #aaa092; font: 3cqw/1.7 var(--serif); }
    .share-card { position: absolute; top: 28cqh; right: 12cqw; left: 12cqw; height: 48cqh; overflow: hidden; border: 1px solid rgba(214,173,132,.45); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
    .share-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 65% center; filter: brightness(.45) saturate(.7); }
    .share-card-copy { position: absolute; inset: 8cqh 7cqw; display: flex; flex-direction: column; align-items: flex-start; }
    .share-card-copy small { color: #d49a6c; font: 2.6cqw var(--serif); letter-spacing: .22em; }
    .share-card-copy h3 { margin: 2.5cqh 0 1cqh; color: #eee1ce; font: 500 8cqw/1.25 var(--serif); }
    .share-card-copy p { margin: 0; color: #d1c0ad; font: 3cqw/1.6 var(--serif); }
    .share-card-copy .share-seal { width: 17cqw; height: 17cqw; margin-top: auto; padding: 2cqw; border: 1px solid rgba(218,147,91,.6); border-radius: 50%; }
    .share-actions { position: absolute; right: 8cqw; bottom: 8cqh; left: 8cqw; display: grid; gap: 1.8cqh; }

    /* 12 · Personal journey */
    .journey-persona { position: absolute; top: 12cqh; right: 7cqw; left: 7cqw; display: flex; align-items: center; gap: 4cqw; }
    .journey-persona img { width: 20cqw; height: 20cqw; object-fit: contain; }
    .journey-persona span { display: block; margin-bottom: 1cqh; color: #c78358; font: 2.7cqw var(--serif); letter-spacing: .14em; }
    .journey-persona strong { color: #eadbc7; font: 500 6cqw var(--serif); }
    .journey-persona p { margin: 1cqh 0 0; color: #aca193; font: 2.7cqw var(--serif); }
    .personal-stats { position: absolute; top: 36cqh; right: 7cqw; left: 7cqw; display: grid; grid-template-columns: repeat(3,1fr); padding: 2.6cqh 0; border-block: 1px solid rgba(214,188,155,.2); }
    .personal-stats div { text-align: center; }

<body>
  <header class="board-head">

          <div class="answers"><div class="answer"><b>A</b><span>行啊，哪里都可以。</span></div><div class="answer selected"><b>B</b><span>可以换，但你现在马上定。</span></div><div class="answer"><b>C</b><span>为什么换？原计划挺好的。</span></div><div class="answer"><b>D</b><span>不换，已经安排好了，出发。</span></div></div>
        </div>
